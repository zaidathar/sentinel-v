name: Update Badges

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  update-badges:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv sync
    
    - name: Calculate coverage
      id: coverage
      run: |
        COVERAGE=$(uv run pytest --cov=app --cov-report=term | grep "TOTAL" | awk '{print $4}' | sed 's/%//')
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        
        COLOR="brightgreen"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          COLOR="yellow"
        fi
        if (( $(echo "$COVERAGE < 60" | bc -l) )); then
          COLOR="red"
        fi
        echo "color=$COLOR" >> $GITHUB_OUTPUT
    
    - name: Count tests
      id: tests
      run: |
        TEST_COUNT=$(uv run pytest --collect-only -q | tail -1 | awk '{print $1}')
        echo "count=$TEST_COUNT" >> $GITHUB_OUTPUT
    
    - name: Update README
      run: |
        COVERAGE="${{ steps.coverage.outputs.coverage }}"
        COLOR="${{ steps.coverage.outputs.color }}"
        TEST_COUNT="${{ steps.tests.outputs.count }}"
        
        sed -i "s|coverage-[0-9]*%25-[a-z]*|coverage-${COVERAGE}%25-${COLOR}|" README.md
        sed -i "s|tests-[0-9]*%20passing-[a-z]*|tests-${TEST_COUNT}%20passing-brightgreen|" README.md
    
    - name: Commit changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        if git diff --quiet README.md; then
          echo "No badge updates needed"
        else
          git add README.md
          git commit -m "chore: update badges [skip ci]"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
