name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv sync
    
    - name: Create test environment file
      run: |
        cat > .env << EOF
        COGNITO_REGION=us-east-1
        COGNITO_USER_POOL_ID=us-east-1_TESTPOOL
        COGNITO_APP_CLIENT_ID=test-client-id
        JWKS_CACHE_TTL=300
        LOG_LEVEL=WARNING
        TESTING_MODE=true
        EOF
    
    - name: Run tests with coverage
      env:
        COGNITO_REGION: us-east-1
        COGNITO_USER_POOL_ID: us-east-1_TESTPOOL
        COGNITO_APP_CLIENT_ID: test-client-id
        JWKS_CACHE_TTL: 300
        LOG_LEVEL: WARNING
        TESTING_MODE: true
      run: |
        uv run pytest --cov=app --cov-report=xml --cov-report=term -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Generate coverage badge
      if: github.ref == 'refs/heads/main'
      run: |
        COVERAGE=$(uv run pytest --cov=app --cov-report=term | grep "TOTAL" | awk '{print $4}' | sed 's/%//')
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
    
    - name: Update README badges
      if: github.ref == 'refs/heads/main'
      run: |
        COVERAGE="${{ env.COVERAGE }}"
        COLOR="brightgreen"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          COLOR="yellow"
        fi
        if (( $(echo "$COVERAGE < 60" | bc -l) )); then
          COLOR="red"
        fi
        
        sed -i "s/coverage-[0-9]*%25-[a-z]*/coverage-${COVERAGE}%25-${COLOR}/" README.md
        
        if git diff --quiet README.md; then
          echo "No changes to README badges"
        else
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore: update coverage badge [skip ci]"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv sync
    
    - name: Check code formatting with black
      run: |
        uv run black --check app tests
      continue-on-error: true
    
    - name: Run type checking with mypy
      run: |
        uv run mypy app --ignore-missing-imports
      continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t sentinel-v:latest .
    
    - name: Test Docker image
      run: |
        docker run --rm sentinel-v:latest python -c "from app.main import app; print('Docker image OK')"
