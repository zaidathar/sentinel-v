[project]
name = "sentinel-v"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35.0",
    "cachetools>=7.0.1",
    "fastapi>=0.129.0",
    "mangum>=0.21.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.32.5",
    "structlog>=25.5.0",
    "uvicorn>=0.40.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

dependencies = [
    "fastapi>=0.129.0",
    "mangum>=0.21.0",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.5.0",
    "uvicorn>=0.40.0",
    "structlog>=24.0.0",
    "cachetools>=5.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[s3]>=5.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "freezegun>=1.5.0",
    "responses>=0.25.0",
    "black>=26.1.0",
    "mypy>=1.19.1",
    "types-requests>=2.32.4.20260107",
]
